; Pool de PHP-FPM para produção (Render)
[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; CRITICAL: Pass all container environment variables to PHP workers.
; Without this, Render's env vars (DB_*, APP_KEY, etc.) are invisible to PHP.
clear_env = no

; Log errors to stderr so Render can capture them
php_flag[display_errors] = off
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

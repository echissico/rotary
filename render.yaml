services:
  - type: web
    name: rotary-web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # Cole a sua APP_KEY do Laravel (ex: base64:...) no painel do Render
      - key: APP_URL
        sync: false # Exemplo: https://rotary-web.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: rotary-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rotary-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rotary-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rotary-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rotary-db
          property: password
      - key: DB_SSLMODE
        value: prefer
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "true"

databases:
  - name: rotary-db
    plan: free
    databaseName: rotary
    user: rotary_user
